version: 2.1

executors:
  node-executor:
    docker:
      - image: cimg/node:22.14
    working_directory: ~/repo

jobs:
  verify:
    executor: node-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - pnpm-deps-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-deps-v1-
      - run:
          name: Enable Corepack & Install pnpm
          command: |
            corepack enable
            corepack prepare pnpm@latest --activate
      - run:
          name: Install Dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-deps-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store
            - node_modules
      - run:
          name: Typecheck (TypeScript)
          command: pnpm exec tsc --noEmit

  deploy:
    executor: node-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - pnpm-deps-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-deps-v1-
      - run:
          name: Enable Corepack & Install pnpm
          command: |
            corepack enable
            corepack prepare pnpm@latest --activate
      - run:
          name: Install Dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Trigger EAS Production Build & Submission
          command: |
            npx eas-cli@latest workflow:run create-production-builds.yml --non-interactive

workflows:
  version: 2
  ci-pipeline:
    jobs:
      - verify:
          filters:
            branches:
              ignore: []
            tags:
              only: /.*/
      - deploy:
          requires:
            - verify
          filters:
            branches:
              only:
                - main
                - master
                - release
            tags:
              only: /^v.*/

